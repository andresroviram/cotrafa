name: core
description: "Capa core compartida: errores, resultado, utilidades, network, performance."
publish_to: "none"
resolution: workspace
version: 0.0.1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Notifications
  bot_toast: ^4.1.3

  # State Management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0

  # HTTP
  dio: ^5.9.1
  dio_http_formatter: ^3.3.1
  dio_cache_interceptor: ^4.0.5

  # Local Storage – Drift
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3_web: ^0.7.1
  web: ^1.1.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # DI
  get_it: ^9.2.0
  injectable: ^3.0.0

  # Utilities
  cryptography: ^2.9.0
  equatable: ^2.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^4.0.0-dev.3
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.2
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true
