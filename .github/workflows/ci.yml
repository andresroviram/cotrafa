name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.9
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Analyze, format, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install workspace tooling
        run: |
          dart pub global activate fvm
          dart pub global activate melos
          env -u FLUTTER_ROOT fvm use "$FLUTTER_VERSION" --force
          env -u FLUTTER_ROOT fvm flutter precache
          test -f .fvm/flutter_sdk/bin/cache/pkg/sky_engine/pubspec.yaml
          echo "FLUTTER_ROOT=" >> "$GITHUB_ENV"

      - name: Create environment files
        run: |
          for flavor in dev qa prod; do
            cat > "apps/cotrafa-app/.env.$flavor" <<EOF
          API_KEY=
          BASE_URL=http://localhost:3000
          EOF
          done

      - name: Bootstrap workspace
        run: fvm dart run melos bootstrap

      - name: Generate code
        run: fvm dart run melos run build:cotrafa-all

      - name: Verify formatting
        run: fvm dart run melos run format:check

      - name: Analyze workspace
        run: fvm dart run melos run analyze

      - name: Install LCOV
        run: sudo apt-get update && sudo apt-get install --yes lcov

      - name: Test with coverage
        run: ./scripts/check_coverage.sh 60

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotrafa-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install workspace tooling
        run: |
          dart pub global activate fvm
          dart pub global activate melos
          env -u FLUTTER_ROOT fvm use "$FLUTTER_VERSION" --force
          env -u FLUTTER_ROOT fvm flutter precache
          test -f .fvm/flutter_sdk/bin/cache/pkg/sky_engine/pubspec.yaml
          echo "FLUTTER_ROOT=" >> "$GITHUB_ENV"

      - name: Create environment files
        run: |
          for flavor in dev qa prod; do
            cp apps/cotrafa-app/.env.example "apps/cotrafa-app/.env.$flavor"
          done

      - name: Bootstrap and generate
        run: |
          fvm dart run melos bootstrap
          fvm dart run melos run build:cotrafa-all

      - name: Build QA APK
        working-directory: apps/cotrafa-app
        run: fvm flutter build apk --release --dart-define=FLAVOR=qa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cotrafa-android-${{ github.sha }}
          path: apps/cotrafa-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  web:
    name: Build web artifact
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install workspace tooling
        run: |
          dart pub global activate fvm
          dart pub global activate melos
          env -u FLUTTER_ROOT fvm use "$FLUTTER_VERSION" --force
          env -u FLUTTER_ROOT fvm flutter precache
          test -f .fvm/flutter_sdk/bin/cache/pkg/sky_engine/pubspec.yaml
          echo "FLUTTER_ROOT=" >> "$GITHUB_ENV"

      - name: Create environment files
        run: |
          for flavor in dev qa prod; do
            cp apps/cotrafa-app/.env.example "apps/cotrafa-app/.env.$flavor"
          done

      - name: Bootstrap and generate
        run: |
          fvm dart run melos bootstrap
          fvm dart run melos run build:cotrafa-all

      - name: Build web QA artifact
        working-directory: apps/cotrafa-app
        run: fvm flutter build web --release --dart-define=FLAVOR=qa

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cotrafa-web-${{ github.sha }}
          path: apps/cotrafa-app/build/web/
          retention-days: 7
